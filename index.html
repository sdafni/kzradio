<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0f12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KZRadio" />
<meta name="description" content="Every KZradio show and episode: search, star, random pick, track listings." />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>KZRadio Picker</title>
<style>
  html, body { margin: 0; background: #0e0f12; color: #f1f1f1; }
  .install {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    margin: 0 auto; max-width: 760px; box-sizing: border-box;
    padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    font: 14px/1.4 -apple-system, "Segoe UI", "Heebo", "Arial Hebrew", Arial, sans-serif;
    color: #9aa0a6; border-bottom: 1px solid #2a2f38;
  }
  .install[hidden] { display: none; }
  .install .text { flex: 1; min-width: 200px; }
  .install b { color: #f1f1f1; }
  .install button {
    font: inherit; font-weight: 600; min-height: 38px; padding: 8px 14px; border-radius: 8px;
    border: 1px solid #ffcc33; background: #ffcc33; color: #1a1a1a; cursor: pointer;
  }
  .install button.ghost { background: transparent; color: #9aa0a6; border-color: #2a2f38; font-weight: 400; }
  .install a { color: #ffcc33; }
</style>
</head>
<body>
<div class="install" id="installBar" dir="ltr" hidden>
  <span class="text" id="installText"></span>
  <button type="button" id="installBtn" hidden>Install app</button>
  <button type="button" class="ghost" id="installDismiss">Not now</button>
</div>

<script src="app.js"></script>
<script>
"use strict";

// ---- install as an app ----------------------------------------------------
// Chrome (Android and desktop) hands the page an install prompt it can show
// on a button tap. iPhone Safari has no such API: the page can only explain
// the two taps in Safari's own menu.

const bar = document.getElementById("installBar");
const text = document.getElementById("installText");
const btn = document.getElementById("installBtn");
const DISMISS_KEY = "kzw.installDismissed";

const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isAndroid = /Android/i.test(navigator.userAgent);
// iPads report a Mac platform; the touch check tells them apart.
const isIos = !isAndroid && (/iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
let dismissed = false;
try { dismissed = localStorage.getItem(DISMISS_KEY) === "1"; } catch {}

function showBar(html, withButton) {
  if (installed || dismissed) return;
  text.innerHTML = html;
  btn.hidden = !withButton;
  bar.hidden = false;
}

let installPrompt = null;
addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installPrompt = e;
  showBar("<b>Install KZRadio</b> as an app on this device.", true);
});

btn.addEventListener("click", async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  const { outcome } = await installPrompt.userChoice;
  installPrompt = null;
  if (outcome === "accepted") bar.hidden = true;
});

addEventListener("appinstalled", () => { bar.hidden = true; });

document.getElementById("installDismiss").addEventListener("click", () => {
  bar.hidden = true;
  try { localStorage.setItem(DISMISS_KEY, "1"); } catch {}
});

// Chrome skips its prompt in some cases (for example after an earlier
// "not now"); then point to the menu entry instead.
if (isAndroid) {
  setTimeout(() => {
    if (!installPrompt) showBar("<b>Install:</b> open the browser menu <b>&#8942;</b> and tap <b>Install app</b> or <b>Add to Home screen</b>.", false);
  }, 3000);
}

if (isIos) {
  showBar("<b>Add to your Home Screen:</b> tap Share <span aria-hidden=\"true\">&#x2B06;&#xFE0E;</span>, then <b>Add to Home Screen</b>.", false);
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(err => console.warn("service worker:", err));
}
</script>
</body>
</html>
